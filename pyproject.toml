[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: orden de imports, B: bugbear,
# UP: sintaxis moderna, DTZ: fechas sin zona horaria, SIM: simplificaciones
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM"]
# Un if/else de varias líneas se lee mejor que un ternario largo
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones las genera Alembic con líneas largas
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
markers = ["e2e: tests end-to-end en navegador (Playwright); se ejecutan con -m e2e"]
# Los e2e necesitan Chromium instalado y van en su propio job de CI
addopts = "-m 'not e2e'"
